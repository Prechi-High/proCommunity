name: Diagnose Unmask inference
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnose-nano.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install modal
      - run: modal app list --json
      - run: modal container list --app-id ap-aGOn3CjHdEawMmNWKnpEev --json
      - run: timeout 40 modal app logs unmask-nano-optimized || test "$?" = 124
