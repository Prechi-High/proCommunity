<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A0E16">
<title>Sourced V1</title>
<style>
@import url('https://api.fontshare.com/v2/css?f[]=boska@400,500,700&f[]=general-sans@400,500,600&display=swap');
:root{
  --wine:#2A0E16;--wine-deep:#210A11;--lac:#3A1622;--lac2:#4B2030;--redact:#0B0306;
  --bone:#F3EBE2;--bone2:rgba(243,235,226,.70);--bone3:rgba(243,235,226,.45);--line:rgba(243,235,226,.14);
  --sage:#9FD0AB;--honey:#E8B95A;--coral:#EE8C7C;--hi:#F2D25B;
  --serif:'Boska',Georgia,'Times New Roman',serif;
  --sans:'General Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#12060A;color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
ul{list-style:none}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.press{transition:transform .18s var(--ease),background .2s,border-color .2s}
.press:active{transform:scale(.95)}
[hidden]{display:none!important}

mark{color:inherit;background:linear-gradient(var(--hi),var(--hi)) no-repeat 0 0/0% 100%;padding:0 .14em;margin:0 -.14em;border-radius:3px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .55s cubic-bezier(.6,0,.2,1) .25s,color .2s .4s}
.hi-on mark,.cl.open mark,.ln.lift mark,.mmr.on mark,.static mark{background-size:100% 100%;color:var(--wine)}

/* ---------- device ---------- */
.stage{min-height:100dvh;display:grid;place-items:center}
.device{position:relative;width:100vw;height:100dvh;background:var(--wine);overflow:hidden;overflow:clip;isolation:isolate}
@media(min-width:520px){.device{width:390px;height:min(844px,calc(100dvh - 32px));border-radius:44px;box-shadow:0 0 0 8px #0b0407,0 30px 80px rgba(0,0,0,.6)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;padding-top:env(safe-area-inset-top);
  transition:opacity .4s var(--ease),visibility 0s .4s}
.screen.on{opacity:1;visibility:visible;transition:opacity .4s var(--ease),visibility 0s}
.screen.hastab{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.body{flex:1;overflow-y:auto;padding:0 20px 24px;scrollbar-width:none;min-height:0}
.body::-webkit-scrollbar{display:none}
#case{opacity:1;transform:translateY(100%);z-index:5;background:var(--wine);transition:transform .75s var(--ease),visibility 0s .75s}
#case.on{transform:none;transition:transform .75s var(--ease),visibility 0s}

.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;background:var(--wine);border-top:1px solid var(--line);
  padding:9px 0 calc(13px + env(safe-area-inset-bottom));transition:transform .45s var(--ease)}
.tabbar.hide{transform:translateY(110%)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--bone3);padding:2px 0}
.tab svg{width:22px;height:22px;transition:transform .3s var(--ease)}
.tab.on{color:var(--bone);font-weight:600}.tab.on svg{color:var(--hi);transform:translateY(-1px)}

/* ---------- shared bits ---------- */
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 0;position:relative;z-index:2}
.mark{font-family:var(--serif);font-weight:700;font-size:25px;letter-spacing:-.02em}
.linkbtn{font-size:14px;font-weight:500;color:var(--bone2);padding:10px 2px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--bone)}
.ib svg{width:22px;height:22px}
.h2{font-family:var(--serif);font-weight:500;font-size:27px;letter-spacing:-.02em;line-height:1.1}
.sm{font-size:14px;line-height:1.5;color:var(--bone2)}
.cap{font-size:12.5px;line-height:1.45;color:var(--bone3)}
.sec{margin-top:44px}.sec>.sm{margin:7px 0 15px}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rh button{font-size:13.5px;font-weight:600;color:var(--bone2);padding:6px 0;white-space:nowrap;flex-shrink:0}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:600;font-size:16px;text-align:center}
.btn.solid{background:var(--bone);color:var(--wine)}.btn.ghost{border:1.5px solid var(--line)}.btn.hl{background:var(--hi);color:var(--wine)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--bone2);white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip.on{background:var(--bone);color:var(--wine);border-color:var(--bone);font-weight:500}
.pv{display:inline-block;font-size:12px;font-weight:500;color:var(--bone2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.pv.own{border-color:transparent;background:rgba(159,208,171,.16);color:var(--sage)}
.pvrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.notice{font-size:13px;line-height:1.5;color:var(--bone2);border-left:2px solid var(--honey);padding:2px 0 2px 12px}
.p{background:var(--sage)}.m{background:var(--honey)}.n{background:var(--coral)}
.mini{display:flex;gap:2px;height:7px}.mini i{display:block;height:100%;border-radius:4px}

/* ---------- HOME ---------- */
.bars{position:absolute;left:0;right:0;top:0;height:620px;overflow:hidden;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent);transition:opacity .2s}
.rb{position:absolute;left:24px;height:15px;border-radius:3px;background:var(--wine-deep);transition:transform .8s var(--ease)}
.peel .rb{transform:translateX(var(--dx))}
.hmain{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:0 24px 8px;scrollbar-width:none}
.hmain::-webkit-scrollbar{display:none}
.hero{font-family:var(--serif);font-weight:500;font-size:clamp(40px,12.6vw,50px);line-height:1.03;letter-spacing:-.025em}
.rd{position:relative;display:inline-block}
.rd::after{content:"";position:absolute;inset:.1em -.06em .02em -.06em;background:var(--redact);transform-origin:100% 50%;animation:unredact .85s var(--ease) forwards;animation-delay:var(--d)}
@keyframes unredact{to{transform:scaleX(0)}}
.sub{margin-top:18px;font-size:17px;line-height:1.45;color:var(--bone2);max-width:31ch}
.search{position:relative;margin-top:28px;display:flex;align-items:center;background:var(--bone);border-radius:22px;height:66px;padding:0 9px 0 20px;transition:box-shadow .25s,transform .3s var(--ease);flex-shrink:0}
.search:focus-within{box-shadow:0 0 0 3px rgba(242,210,91,.6);transform:translateY(-2px)}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font:500 17px var(--sans);color:var(--wine)}
.ph{position:absolute;left:20px;right:70px;top:50%;transform:translateY(-50%);font-size:17px;font-weight:500;color:rgba(42,14,22,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.search.has .ph{display:none}
.sbtn{width:48px;height:48px;border-radius:16px;background:var(--wine);color:var(--bone);display:grid;place-items:center;transition:background .2s,color .2s,transform .25s var(--ease)}
.sbtn:active{transform:scale(.9)}.search.has .sbtn{background:var(--hi);color:var(--wine)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.try{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.try .chip:hover{border-color:var(--bone3)}
.sugg{margin-top:8px}
.srow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line);width:100%}
.srow b{flex:1;font-size:16px;font-weight:600;line-height:1.25}.srow small{display:block;font-weight:400;font-size:12.5px;color:var(--bone3);margin-top:1px}
.snum{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.02em}
.snum.none{font-family:var(--sans);font-size:13px;color:var(--bone3);font-weight:500}
.seeall{padding:14px 2px;border-top:1px solid var(--line);font-size:14.5px;font-weight:600;color:var(--bone2);width:100%}
.recent{margin-top:24px}
.foot{position:relative;z-index:2;padding:6px 24px 14px;font-size:13px;line-height:1.55;color:var(--bone3)}

/* ---------- RESULTS ---------- */
.rfield{margin:8px 0 0;background:var(--bone);color:var(--wine);border-radius:16px;height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:500;font-size:16px;width:100%}
.rfield svg{width:20px;height:20px;opacity:.6}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:3px 14px;align-items:center;padding:16px 0;border-top:1px solid var(--line);width:100%}
.res .thumb{grid-row:1/4}
.res b{font-size:16px;font-weight:600;line-height:1.25}.res small{font-size:12.5px;color:var(--bone3)}
.res .rs{grid-row:1/3;grid-column:3;text-align:right;font-family:var(--serif);font-size:32px;font-weight:500;letter-spacing:-.03em;line-height:1}
.res .rs small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;margin-top:4px}
.res .mini{grid-column:2/4}
.thumb{width:48px;height:60px;border-radius:12px;background:var(--lac);display:grid;place-items:center}

/* ---------- INVESTIGATION ---------- */
.ptop{display:flex;padding:12px 14px 0}
.pbody{flex:1;display:flex;flex-direction:column;padding:4px 24px 0;min-height:0}
.pq{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.pq small{display:block;font-family:var(--sans);font-size:14px;font-weight:400;color:var(--bone3);margin-bottom:6px;letter-spacing:0}
.doc{margin-top:18px;background:var(--lac);border-radius:20px;padding:12px 18px}
.ln{position:relative;padding:7px 0;font-family:var(--serif);font-size:17px;line-height:1.25;overflow:hidden}
.ln .bar{position:absolute;inset:4px 0;background:var(--redact);border-radius:2px;transform-origin:var(--o) 50%;transition:transform .6s var(--ease)}
.ln.lift .bar{transform:scaleX(0)}
.stg{margin-top:22px;font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.08;letter-spacing:-.02em;min-height:2.2em}
.stg.swap{animation:swap .4s var(--ease)}@keyframes swap{from{opacity:0;transform:translateY(8px)}}
.srcs{margin-top:auto;padding-bottom:12px}
.srcs li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;color:var(--bone3);transition:color .3s}
.srcs li.act{color:var(--bone)}.srcs li.done .val{color:var(--sage)}
.val{font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.val svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .35s var(--ease)}
.srcs li.done .val svg{opacity:1;transform:none}
.pg{grid-column:1/-1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--bone)}.srcs li.done .pg i{background:var(--sage)}
.pfoot{display:flex;justify-content:space-between;align-items:center;padding:6px 24px calc(18px + env(safe-area-inset-bottom));font-size:13px;color:var(--bone3);min-height:56px}
.skip{padding:10px 4px;font-weight:500;color:var(--bone2);opacity:0;pointer-events:none;transition:opacity .4s}.skip.show{opacity:1;pointer-events:auto}

/* ---------- CASE ---------- */
.ctop{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;flex-shrink:0}
.ctt{font-size:14px;font-weight:600;opacity:0;transform:translateY(4px);transition:all .3s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.ctt.on{opacity:1;transform:none}
#save.on svg{fill:var(--hi);color:var(--hi)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding-top:6px}
.brand{font-size:14px;color:var(--bone2)}
.phead h1{font-family:var(--serif);font-weight:500;font-size:31px;line-height:1.05;letter-spacing:-.025em;margin-top:4px}
.score{margin-top:28px}
.srow2{display:flex;align-items:flex-end;gap:16px}
.bignum{font-family:var(--serif);font-weight:500;font-size:132px;line-height:.78;letter-spacing:-.05em;font-variant-numeric:tabular-nums;min-width:1.15ch}
.slab{padding-bottom:4px}.slab b{display:block;font-size:17px;font-weight:600}.slab span{font-size:14px;color:var(--bone2);line-height:1.4;display:block;margin-top:2px}
.verdict{margin-top:22px;font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.22;letter-spacing:-.015em}
.split{display:flex;gap:3px;margin-top:22px}
.split i{display:block;height:12px;border-radius:6px;flex:none;width:0;transition:width 1.1s var(--ease)}
.split.go .p{width:calc(var(--w)*1% - 2px)}.split.go .m{width:calc(var(--w)*1% - 2px);transition-delay:.12s}.split.go .n{width:calc(var(--w)*1% - 2px);transition-delay:.24s}
.legend{display:flex;gap:16px;margin-top:10px;font-size:14px;color:var(--bone2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:8px;height:8px;border-radius:50%}
.basis{margin-top:16px;font-size:14px;line-height:1.5;color:var(--bone2)}
.how{margin-top:10px;font-size:14px;color:var(--bone2)}
.how summary{cursor:pointer;font-weight:500;color:var(--bone);list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.how summary::-webkit-details-marker{display:none}.how summary svg{width:14px;height:14px;transition:transform .3s var(--ease)}.how[open] summary svg{transform:rotate(180deg)}
.how p{line-height:1.55;margin-top:4px;max-width:44ch}
.calc{margin-top:8px;background:var(--lac);border-radius:14px;padding:12px 14px;line-height:1.7}

.fit{margin-top:40px;background:var(--lac);border-radius:26px;padding:22px}
.fit .h2{font-size:25px}
.skin{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.skin button{padding:15px 14px;border-radius:14px;border:1.5px solid var(--line);font-weight:500;font-size:15px;transition:all .2s}
.skin button.on{background:var(--bone);color:var(--wine);border-color:var(--bone)}
.quizlink{margin-top:12px;font-size:14px;font-weight:600;color:var(--bone2);padding:6px 0}
.fres{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.fit.done .fres{display:block}
.frow{display:flex;align-items:flex-end;gap:14px}
.fnum{font-family:var(--serif);font-weight:500;font-size:84px;line-height:.8;letter-spacing:-.045em;font-variant-numeric:tabular-nums;min-width:1.15ch}
.flab b{display:block;font-size:17px;font-weight:600}.flab span{font-size:14px;color:var(--bone2)}
.fwhy{margin-top:16px;font-size:15px;line-height:1.55}.fwhy em{font-style:normal;color:var(--bone2)}

.cl{border-top:1px solid var(--line)}.cl:last-child{border-bottom:1px solid var(--line)}
.clh{width:100%;display:flex;align-items:center;gap:12px;padding:16px 0}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.clt{flex:1;min-width:0}.clt b{display:block;font-size:17px;font-weight:600;line-height:1.25}.clt small{display:block;margin-top:3px;font-size:13px;color:var(--bone3)}
.clp{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;color:var(--bone3);transition:transform .35s var(--ease);flex-shrink:0}.cl.open .chev{transform:rotate(180deg)}
.clb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}.cl.open .clb{grid-template-rows:1fr}
.cli{overflow:hidden}
.cli blockquote{padding:0 0 14px 22px;font-size:16px;line-height:1.55}.cli blockquote .pv{margin-right:8px;vertical-align:1px}
.seen{padding:2px 0 16px 22px;display:flex;flex-direction:column;gap:8px}
.mom{display:flex;gap:12px;align-items:center;background:var(--lac);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.35;width:100%}
.mom .pl{width:32px;height:32px;border-radius:50%;background:var(--bone);color:var(--wine);display:grid;place-items:center;flex-shrink:0}
.mom .pl svg{width:14px;height:14px;margin-left:2px}
.mom b{font-variant-numeric:tabular-nums;margin-right:5px}
.mom em{margin-left:auto;font-style:normal;font-size:12px;color:var(--bone3);white-space:nowrap}

.ph2{position:relative;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.26),rgba(255,255,255,0) 62%),var(--t);overflow:hidden}
.ph2 i{position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(80,30,20,.34)}
.ph2 em{position:absolute;left:6px;bottom:5px;font-style:normal;font-size:10.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.row{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:20px}
.row::-webkit-scrollbar{display:none}
.row>*{scroll-snap-align:start}
.row.grid{display:grid;grid-template-columns:1fr 1fr;margin:0;padding:0;gap:18px 12px}
.reflow{animation:reflow .5s var(--ease)}@keyframes reflow{from{opacity:0;transform:translateY(8px)}}
.tl{width:238px;flex-shrink:0;text-align:left}
.row.grid .tl,.row.grid .vc{width:auto}
.tl-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden;height:120px}
.tl-cap{margin-top:9px;font-size:14px;line-height:1.4}.tl .pvrow{margin-top:7px}
.vc{width:208px;flex-shrink:0;text-align:left}
.vt{position:relative;height:118px;border-radius:14px;background:var(--lac2);display:grid;place-items:center;overflow:hidden}
.vt .plb{width:40px;height:40px;border-radius:50%;background:rgba(243,235,226,.92);color:var(--wine);display:grid;place-items:center;transition:transform .2s var(--ease)}
.vc:active .plb{transform:scale(.9)}
.vt .plb svg{width:16px;height:16px;margin-left:2px}
.vt .dur{position:absolute;right:8px;top:8px;font-size:11px;font-weight:600;background:rgba(11,3,6,.7);border-radius:6px;padding:2px 6px}
.ticks{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(243,235,226,.18)}.ticks i{position:absolute;top:0;bottom:0;background:var(--hi)}
.vc p{margin-top:9px;font-size:14px;line-height:1.35}.vc .pvrow{margin-top:6px}
.ptag{margin:0 0 14px}

.who li{padding:14px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:9px 12px;align-items:center;transition:padding .35s var(--ease),background .35s,box-shadow .35s}
.who li:last-child{border-bottom:1px solid var(--line)}
.who .nm{font-weight:600;font-size:16px}.who .nm small{font-weight:400;color:var(--bone3);font-size:13px;margin-left:8px}
.who .mini{grid-column:1/-1}
.who li.me{padding-left:14px;background:rgba(243,235,226,.06);box-shadow:inset 3px 0 0 var(--hi)}
.ing{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
.ing:last-of-type{border-bottom:1px solid var(--line)}
.ing b{min-width:100px;font-weight:600}.ing span{color:var(--bone2)}
.thr{display:block;padding:15px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.thr b{font-size:16px;font-weight:600;display:block}.thr p{font-size:14px;color:var(--bone2);margin-top:3px;line-height:1.45}.thr small{display:block;margin-top:6px;font-size:12.5px;color:var(--bone3)}
.fine{margin-top:40px;font-size:13px;line-height:1.6;color:var(--bone3)}
.dock{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--wine);border-top:1px solid var(--line);flex-shrink:0}
.askbar{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-radius:16px;background:var(--lac);font-size:15px;color:var(--bone2)}
.askbar svg{width:20px;height:20px;color:var(--hi);flex-shrink:0}.askbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy{height:54px;padding:0 18px;border-radius:16px;background:var(--bone);color:var(--wine);font-weight:600;font-size:15px;white-space:nowrap;text-align:center}
.thin h2{font-size:36px}

/* ---------- TABS: shelf / saved / you ---------- */
.card{background:var(--lac);border-radius:22px;padding:18px}
.dash{display:flex;gap:5px;margin-top:14px}.dash i{flex:1;height:4px;border-radius:3px;background:rgba(243,235,226,.2);transition:background .3s}.dash i.d{background:var(--sage)}
.seg{display:flex;gap:6px}.seg button{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--bone2);transition:all .2s}
.seg button.on{background:var(--bone);color:var(--wine);border-color:var(--bone)}
.task{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.task .ck{width:28px;height:28px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:all .25s var(--ease)}
.task .ck svg{width:16px;height:16px;transform:scale(0);transition:transform .25s var(--ease)}
.task.d .ck{background:var(--sage);border-color:var(--sage);color:var(--wine)}.task.d .ck svg{transform:scale(1)}
.task b{font-size:16px;font-weight:600;display:block}.task small{font-size:12.5px;color:var(--bone3)}
.tlm{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.tlm .ph2{width:76px;height:96px;border-radius:12px;flex-shrink:0}
.tlm b{font-size:15.5px;font-weight:600}.tlm p{font-size:14px;color:var(--bone2);margin-top:3px;line-height:1.4}
.tlm button{margin-top:7px;font-size:13px;font-weight:600;color:var(--bone2);padding:4px 0;display:block}
.si{display:flex;align-items:center;gap:13px;padding:14px 0;border-top:1px solid var(--line)}
.si .nm{flex:1;text-align:left}.si b{font-size:16px;font-weight:600;display:block}.si small{font-size:12.5px;color:var(--bone3)}
.si .drop{color:var(--sage)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--bone3);border:1.5px solid var(--line);transition:all .2s}
.iconbtn svg{width:18px;height:18px}.iconbtn.on{background:var(--hi);border-color:var(--hi);color:var(--wine)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.tog b{font-size:15.5px;font-weight:600;display:block}.tog small{font-size:13px;line-height:1.45;color:var(--bone3);display:block;margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--bone);transition:transform .25s var(--ease)}
.sw.on{background:var(--sage)}.sw.on::after{transform:translateX(18px);background:var(--wine)}

/* ---------- SHEETS ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,3,6,.62);opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--lac);border-radius:28px 28px 0 0;transform:translateY(105%);visibility:hidden;
  transition:transform .55s var(--ease),visibility 0s .55s;display:flex;flex-direction:column;max-height:92%;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none;visibility:visible;transition:transform .55s var(--ease),visibility 0s}
.sheet.tall{height:92%}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex-shrink:0}
.shead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px 22px;flex-shrink:0}
.shead h3{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.015em}
.sbody{padding:8px 22px 22px;overflow-y:auto;flex:1;min-height:0}
.sbody .seg{margin-bottom:14px}
.subhead{padding:0 22px;flex-shrink:0}
/* video */
.vp{position:relative;height:200px;background:var(--redact);border-radius:16px;display:grid;place-items:center;overflow:hidden}
.vp .plb{width:56px;height:56px;border-radius:50%;background:rgba(243,235,226,.94);color:var(--wine);display:grid;place-items:center;transition:transform .2s var(--ease)}
.vp .plb:active{transform:scale(.92)}.vp .plb svg{width:22px;height:22px}
.vp .tm{position:absolute;left:14px;bottom:10px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.scrub{position:relative;height:10px;border-radius:5px;background:var(--line);margin:16px 6px 0;cursor:pointer}
.scrub i{position:absolute;top:0;bottom:0;background:var(--hi);border-radius:5px}
.scrub b{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--bone);transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.mmr{display:flex;gap:14px;align-items:flex-start;width:100%;padding:14px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4;text-align:left}
.mmr time{font-variant-numeric:tabular-nums;font-weight:600;min-width:40px;color:var(--bone2)}.mmr.on time{color:var(--hi)}
/* before/after */
.ba{position:relative;height:330px;border-radius:20px;overflow:hidden;touch-action:none;--x:50%;cursor:ew-resize}
.ba .ph2{position:absolute;inset:0}.ba .ph2 i{width:13px;height:13px;background:rgba(80,30,20,.4)}
.ba .before{clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.ba .hd{position:absolute;top:0;bottom:0;left:var(--x);width:2px;background:var(--bone);transform:translateX(-1px)}
.ba .hd::after{content:"";position:absolute;top:50%;left:50%;width:38px;height:38px;border-radius:50%;background:var(--bone);transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.ba .hd::before{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);z-index:2;color:var(--wine);font-weight:700;font-size:16px;letter-spacing:2px;white-space:nowrap}
.ba .tag{position:absolute;top:12px;font-size:12px;font-weight:600;background:rgba(11,3,6,.7);padding:4px 10px;border-radius:999px;z-index:2}
/* chat + threads */
.msg{font-size:16px;line-height:1.55}
.bubble{background:var(--lac2);border-radius:18px 18px 4px 18px;padding:10px 15px;font-size:15.5px;line-height:1.45;max-width:82%;margin-left:auto}
.chat{display:flex;flex-direction:column;gap:14px}
.dots{display:inline-flex;gap:5px;padding:6px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--bone2);animation:pulse 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.srcrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.srcrow span{font-size:12px;color:var(--bone2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.suggs{display:flex;flex-direction:column;gap:8px}.suggs button{padding:13px 16px;border:1px solid var(--line);border-radius:14px;font-size:15px}
.askin{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);flex-shrink:0}
.askin input{flex:1;min-width:0;height:50px;border-radius:14px;border:1.5px solid var(--line);background:none;color:var(--bone);padding:0 16px;font:500 16px var(--sans);outline:0}
.askin input:focus{border-color:var(--hi)}
.askin button{width:50px;height:50px;border-radius:14px;background:var(--hi);color:var(--wine);display:grid;place-items:center}
.post{padding:15px 0;border-top:1px solid var(--line)}
.post p{font-size:15.5px;line-height:1.55;margin-top:8px}
.rel{display:inline-block;font-size:12px;font-weight:600;color:var(--bone2);background:var(--lac2);border-radius:999px;padding:3px 10px;margin-top:12px}
.oinfo{font-size:13px;color:var(--bone2);margin-top:8px;padding:8px 12px;background:rgba(243,235,226,.06);border-radius:10px}
.ext{background:rgba(243,235,226,.05);border:1px dashed var(--line);border-radius:14px;padding:12px;margin:10px 0}
.back{font-size:14px;font-weight:600;color:var(--bone2);padding:4px 0 12px;display:flex;align-items:center;gap:6px}.back svg{width:16px;height:16px}
.store{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:16px 0;border-top:1px solid var(--line);align-items:center;width:100%;text-align:left}
.store b{font-size:16px;font-weight:600}.store small{font-size:13px;color:var(--bone3)}
.store .pr{font-family:var(--serif);font-size:22px;font-weight:500;grid-row:1/3;grid-column:2;text-align:right}
.store .pr em{display:block;font-family:var(--sans);font-style:normal;font-size:12px;color:var(--sage);font-weight:500}
.stk{margin:0 -10px;padding:16px 10px;border-radius:14px;background:rgba(159,208,171,.08);border-top-color:transparent}
.authp{font-size:15px;line-height:1.55;color:var(--bone2);margin:2px 0 18px;max-width:36ch}
.stack{display:flex;flex-direction:column;gap:10px}
.txt{display:block;width:100%;text-align:center;padding:14px;color:var(--bone2);font-weight:500}
.qopt{width:100%;padding:16px;border:1.5px solid var(--line);border-radius:14px;font-size:15px;font-weight:500;margin-top:10px;text-align:left;transition:all .2s}
.qopt.sel{background:var(--bone);color:var(--wine);border-color:var(--bone)}
.qprog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.qprog i{display:block;height:100%;background:var(--hi);transition:width .4s var(--ease)}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,16px);opacity:0;background:var(--bone);color:var(--wine);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:40;pointer-events:none;white-space:nowrap;transition:all .4s var(--ease);max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- V1.1: banger home + living community ---------- */
.pulse{width:8px;height:8px;border-radius:50%;background:var(--sage);position:relative;flex-shrink:0;display:inline-block}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--sage);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.5);opacity:.9}to{transform:scale(1.7);opacity:0}}
.live{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--bone2);background:rgba(243,235,226,.07);border-radius:999px;padding:8px 14px}
#home .hmain{justify-content:flex-start;padding-top:10px;padding-bottom:30px}
#home .top{padding-bottom:10px}
.hero2{font-family:var(--serif);font-weight:500;font-size:clamp(54px,17.4vw,74px);line-height:.95;letter-spacing:-.035em;margin-top:20px}
.rd{cursor:pointer}
.rd.cover::after{animation:none;transform:scaleX(1)}
.rd.replay::after{animation-delay:.05s}
.search.big{height:78px;border-radius:28px;margin-top:26px;padding:0 10px 0 24px;animation:breathe 2.4s ease-in-out 1.8s 3}
.search.big input{font-size:18px}
.search.big .ph{left:24px;font-size:18px}
.search.big .sbtn{width:56px;height:56px;border-radius:20px}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(242,210,91,0)}50%{box-shadow:0 0 0 7px rgba(242,210,91,.22)}}
.ticker{display:flex;align-items:center;gap:11px;margin-top:6px;padding:14px 4px;font-size:14.5px;color:var(--bone2);width:100%;text-align:left}
.ticker .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s,transform .3s var(--ease)}
.ticker .t.out{opacity:0;transform:translateY(-6px)}
.ticker .go{color:var(--bone3);font-size:13px;font-weight:600}
.hfeed{margin-top:22px}
.dig{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.dig b{flex:1;font-size:16px;font-weight:600;line-height:1.25}.dig small{display:block;font-weight:400;font-size:13px;color:var(--bone3);margin-top:2px}
.dig .dn{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--sage);display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:500}
.q{display:block;padding:16px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.q .qt{font-family:var(--serif);font-size:21px;line-height:1.2;letter-spacing:-.01em}
.q .qm{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:13px;color:var(--bone3)}
.foot2{margin-top:26px;font-size:12.5px;line-height:1.55;color:var(--bone3)}
.pagetitle{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:-.02em}
.pv.exp{border-color:transparent;background:rgba(232,185,90,.16);color:var(--honey)}
.av{width:44px;height:44px;border-radius:50%;background:var(--lac2);display:grid;place-items:center;font-family:var(--serif);font-size:19px;flex-shrink:0}
.av.exp{background:rgba(232,185,90,.2);color:var(--honey)}
.av.big{width:88px;height:88px;font-size:36px;margin:6px auto 0}
.av.speak{animation:speak 1.5s infinite}
@keyframes speak{0%{box-shadow:0 0 0 0 rgba(232,185,90,.5)}80%,100%{box-shadow:0 0 0 18px rgba(232,185,90,0)}}
.roomhero{display:block;width:100%;text-align:left;margin-top:20px;background:var(--lac);border-radius:26px;padding:20px;position:relative;overflow:hidden}
.rtag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--sage)}
.rt{display:block;font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1;letter-spacing:-.02em;margin-top:12px}
.rhost{display:flex;align-items:center;gap:12px;margin-top:16px}
.rhost b{font-size:15px;font-weight:600;display:block}.rhost small{font-size:13px;color:var(--bone2)}
.rjoin{display:block;margin-top:18px;background:var(--hi);color:var(--wine);text-align:center;font-weight:600;font-size:16px;padding:15px;border-radius:16px}
.urow{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
.urow .ut{flex:1;min-width:0;text-align:left}.urow b{font-size:16px;font-weight:600;line-height:1.25;display:block}.urow small{display:block;font-size:13px;color:var(--bone3);margin-top:3px}
.remind{flex-shrink:0;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;transition:all .2s;white-space:nowrap}
.remind.on{background:var(--sage);border-color:var(--sage);color:var(--wine)}
.composer{margin-top:34px;background:var(--lac);border-radius:26px;padding:22px}
.composer .chips{margin-top:14px}
.jc{width:224px;flex-shrink:0;text-align:left;display:block}
.jc .tl-strip{height:108px}
.jc b{display:block;margin-top:10px;font-size:15.5px;font-weight:600}.jc small{display:block;font-size:13px;color:var(--bone3);margin-top:2px}
.jrow{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px}
.fbtn{padding:8px 15px;border-radius:12px;border:1.5px solid var(--bone3);font-size:13.5px;font-weight:600;transition:all .2s}
.fbtn.on{background:var(--bone);color:var(--wine);border-color:var(--bone)}
.exrow{display:flex;align-items:center;gap:13px;padding:15px 0;border-top:1px solid var(--line)}
.exrow .x{flex:1;min-width:0}.exrow b{font-size:16px;font-weight:600;display:block}.exrow small{display:block;font-size:13px;color:var(--bone2);margin-top:2px;line-height:1.4}
.exrow .askx{padding:10px 16px;border-radius:12px;background:var(--bone);color:var(--wine);font-weight:600;font-size:14px}
.ta{width:100%;min-height:140px;border-radius:16px;border:1.5px solid var(--line);background:none;color:var(--bone);padding:14px 16px;font:500 16px/1.5 var(--sans);outline:0;resize:none;margin-top:12px}
.ta:focus{border-color:var(--hi)}
.jhead{display:flex;align-items:center;gap:13px}
.jhead .x{flex:1;min-width:0}.jhead b{font-size:17px;font-weight:600;display:block}.jhead small{font-size:13px;color:var(--bone2)}
.react{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.react button{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:500;transition:all .2s var(--ease)}
.react button.on{background:var(--hi);border-color:var(--hi);color:var(--wine)}
.up{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.up .ph2{width:64px;height:80px;border-radius:12px;flex-shrink:0}
.up b{font-size:15px;font-weight:600}.up p{font-size:14.5px;line-height:1.45;color:var(--bone2);margin-top:3px}
.qbub{background:var(--lac2);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:15px;margin:10px 0 0 auto;max-width:86%}
.rchat{margin-top:14px;max-height:250px;overflow-y:auto;scrollbar-width:none;min-height:150px}
.rc{padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.45;animation:swap .4s var(--ease)}
.rc b{font-weight:600}.rc small{color:var(--bone3);font-weight:400}
.rc.ex{background:rgba(232,185,90,.07);border-radius:12px;padding:11px 12px;margin:4px 0;border-top:0}.rc.ex b{color:var(--honey)}
.rctl{display:flex;gap:8px;margin-top:14px}
.rbtn{flex:1;text-align:center;padding:14px 8px;border-radius:14px;border:1.5px solid var(--line);font-weight:600;font-size:14.5px;transition:all .2s}
.rbtn.on{background:var(--hi);color:var(--wine);border-color:var(--hi)}.rbtn:disabled{opacity:.45}
.roomt{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.15;letter-spacing:-.015em;text-align:center;margin-top:16px}
.bigremind{display:block;width:100%;padding:17px;border-radius:16px;font-weight:600;font-size:16px;text-align:center;background:var(--hi);color:var(--wine);transition:all .2s}

.about li{padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.follow-new{font-size:11.5px;font-weight:600;background:var(--hi);color:var(--wine);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:1px}

/* ---------- V2: focus, chapters, haptic language ---------- */
.forline{margin-top:16px;font-size:17px;line-height:1.4;color:var(--bone2);min-height:1.4em;transition:opacity .35s,transform .35s var(--ease)}
.forline.out{opacity:0;transform:translateY(-6px)}
.hero2{font-size:clamp(56px,17.6vw,78px)}
#home .hmain{justify-content:center;padding-bottom:16px}
.digrow{margin-top:8px}
.digrow .cap{margin-bottom:10px}
.dchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -24px;padding:0 24px}
.dchips::-webkit-scrollbar{display:none}
.dc{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:11px 15px;border:1px solid var(--line);border-radius:999px;font-size:14.5px;font-weight:500;color:var(--bone)}
.dc .dn{font-variant-numeric:tabular-nums;font-size:13px;color:var(--sage);display:flex;align-items:center;gap:7px}
.ctop2{display:flex;align-items:center;gap:4px;padding:12px 10px 2px;flex-shrink:0}
.prog{flex:1;display:flex;gap:6px;padding:0 4px}
.prog button{flex:1;height:26px;display:flex;align-items:center}
.prog i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);transition:background .35s}
.prog button.done i{background:var(--bone3)}.prog button.on i{background:var(--hi)}
.cstage{flex:1;min-height:0;overflow-y:auto;padding:0 22px 20px;scrollbar-width:none}
.cstage::-webkit-scrollbar{display:none}
.cpage.rin{animation:slideR .45s var(--ease)}.cpage.lin{animation:slideL .45s var(--ease)}
@keyframes slideR{from{opacity:0;transform:translateX(34px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-34px)}}
.kick{font-size:14px;color:var(--bone2);font-weight:500;padding-top:6px}
.dock2{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--wine);border-top:1px solid var(--line);flex-shrink:0}

   <button class="btn ghost press" id="hDemo" style="margin-top:12px">Feel our signature</button></div>
  <div class="sec" style="margin-top:28px"><h2 class="h2" style="font-size:22px">Where the data comes from</h2><p class="sm" style="margin-top:6px">Public YouTube comments and Reddit threads, plus posts from verified owners on Sourced. Every source is labeled wherever it appears. Nothing is paid for and nothing is removed.</p></div>
  <div class="sec" style="margin-top:28px"><h2 class="h2" style="font-size:22px">Privacy</h2>
   <button class="tog" style="margin-top:8px" data-t="hist"><span><b>Save my search history</b><small>Visible to you only. Delete any time.</small></span><span class="sw${state.history?' on':''}"></span></button>
   <button class="tog" data-t="drops"><span><b>Drops from Sourced</b><small>A message when something has been community-tested for your skin. Sponsored ones are always labeled. Off unless you turn it on.</small></span><span class="sw${state.drops?' on':''}"></span></button>
   <div class="tog" style="border-bottom:1px solid var(--line)"><span><b>Progress photos</b><small>Always private until you share, one entry at a time.</small></span></div></div>
  <div class="sec" style="margin-top:28px"><h2 class="h2" style="font-size:22px">Account</h2><p class="sm" style="margin:6px 0 14px">${state.signed?'Verified. Your skin details and saved products are kept.':'You’re using Sourced without an account. You only need one to save your profile, post, or mark something as bought.'}</p>${state.signed?'':'<button class="btn solid press" id="youIn">Verify with Google or email</button>'}<button class="btn ghost press" id="delData" style="margin-top:10px">Delete my data</button></div>`;
}
$('#youBody').addEventListener('click',async e=>{
  let el;
  if(e.target.closest('#setSkin'))return openQuiz();
  if(el=e.target.closest('[data-hs]')){state.hapScale=+el.dataset.hs;renderYou();return haptic('success')}
  if(e.target.closest('#hDemo')){const seq=[['sign','Sourced signature'],['peel','A redaction lifts'],['source','A source is read'],['verdict','The verdict lands'],['mark','A highlight is marked'],['presence','Someone’s here'],['owner','A verified owner replies'],['expert','An expert replies']];
    for(const [k,l] of seq){toast(l);haptic(k);await sleep(1300)}return}
  if(e.target.closest('[data-t="hist"]')){state.history=!state.history;haptic('select');return renderYou()}
  if(e.target.closest('[data-t="drops"]')){state.drops=!state.drops;haptic(state.drops?'success':'select');return renderYou()}
  if(e.target.closest('#youIn'))return openAuth('in');
  if(e.target.closest('#delData')){state.recent=[];state.skin=null;state.saved={};state.drops=false;haptic('heavy');toast('Your data has been deleted');renderYou()}
});

go('home');
</script>
</body>
</html>
