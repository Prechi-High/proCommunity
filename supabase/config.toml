# Meta calls these directly and signs requests with the app secret (verified in code).
[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-flow-data]
verify_jwt = false

# Service-role bearer is checked in code.
[functions.whatsapp-worker]
